<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>通知发送</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: linear-gradient(160deg, #e0ecff 0%, #f0f7ff 40%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        .page-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* 顶部图标 */
        .header-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }

        .header-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        /* 标题 */
        .title {
            font-size: 26px;
            font-weight: 700;
            color: #1e3a5f;
            text-align: center;
        }

        .subtitle {
            font-size: 15px;
            color: #64748b;
            text-align: center;
            margin-top: -12px;
        }

        /* 卡片容器 */
        .card {
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 输入区域 */
        .input-label {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .textarea-container {
            position: relative;
        }

        #noticeContent {
            width: 100%;
            min-height: 140px;
            padding: 16px;
            font-size: 17px;
            line-height: 1.6;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            font-family: inherit;
            color: #1e293b;
            background: #f8fafc;
        }

        #noticeContent:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            background: #ffffff;
        }

        #noticeContent::placeholder {
            color: #94a3b8;
        }

        .char-count {
            position: absolute;
            bottom: 12px;
            right: 14px;
            font-size: 13px;
            color: #94a3b8;
            pointer-events: none;
        }

        .char-count.warning {
            color: #ef4444;
            font-weight: 600;
        }

        /* 状态提示 */
        .status-bar {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        .status-bar.show {
            display: flex;
        }

        .status-bar.sending {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
        }

        .status-bar.success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .status-bar.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 加载动画 */
        .loading-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2563eb;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        .loading-dot:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 发送按钮 */
        #sendBtn {
            width: 100%;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            letter-spacing: 2px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #sendBtn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 底部提示 */
        .footer-text {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }

        /* 隐藏 React root */
        #root {
            display: none;
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <!-- 图标 -->
    <div class="header-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- 标题 -->
    <h1 class="title">发送通知</h1>
    <p class="subtitle">输入通知内容，一键推送给所有人</p>

    <!-- 主卡片 -->
    <div class="card">
        <div>
            <label class="input-label" for="noticeContent">通知内容</label>
            <div class="textarea-container">
                <textarea 
                    id="noticeContent" 
                    placeholder="请输入要发送的通知内容..." 
                    maxlength="200"
                ></textarea>
                <span class="char-count" id="charCount">0/200</span>
            </div>
        </div>

        <!-- 状态提示 -->
        <div class="status-bar" id="statusBar">
            <span id="statusContent"></span>
        </div>

        <!-- 发送按钮 -->
        <button id="sendBtn">发送通知</button>
    </div>

    <p class="footer-text">发送后通知将立即推送到所有接收端</p>
</div>

<!-- React 入口（仅用于构建通过，不渲染任何内容） -->
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>

<script>
    // ============ 配置区域 ============
    const API_URL = 'https://你的worker地址/api/send';
    const TOKEN = '固定令牌';
    const MAX_LENGTH = 200;
    // ================================

    const textarea = document.getElementById('noticeContent');
    const charCount = document.getElementById('charCount');
    const sendBtn = document.getElementById('sendBtn');
    const statusBar = document.getElementById('statusBar');
    const statusContent = document.getElementById('statusContent');

    let isSending = false;
    let statusTimer = null;

    // 字数统计
    textarea.addEventListener('input', function() {
        const len = this.value.length;
        charCount.textContent = len + '/' + MAX_LENGTH;
        
        if (len >= MAX_LENGTH) {
            charCount.classList.add('warning');
        } else {
            charCount.classList.remove('warning');
        }
    });

    // 显示状态
    function showStatus(type, message) {
        // 清除之前的定时器
        if (statusTimer) {
            clearTimeout(statusTimer);
            statusTimer = null;
        }

        statusBar.className = 'status-bar show ' + type;
        
        if (type === 'sending') {
            statusContent.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>&nbsp;&nbsp;发送中…';
        } else {
            statusContent.textContent = message;
        }
    }

    // 隐藏状态
    function hideStatus() {
        statusBar.classList.remove('show');
    }

    // 发送通知
    async function sendNotice() {
        if (isSending) return;

        const content = textarea.value.trim();

        if (!content) {
            showStatus('error', '⚠️ 请输入通知内容');
            statusTimer = setTimeout(hideStatus, 3000);
            return;
        }

        isSending = true;
        sendBtn.disabled = true;
        sendBtn.textContent = '发送中…';

        showStatus('sending', '');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    content: content,
                    token: TOKEN
                })
            });

            if (response.ok) {
                // 发送成功
                textarea.value = '';
                charCount.textContent = '0/' + MAX_LENGTH;
                charCount.classList.remove('warning');
                showStatus('success', '✅ 发送成功');
            } else {
                throw new Error('HTTP ' + response.status);
            }
        } catch (error) {
            console.error('发送失败:', error);
            showStatus('error', '❌ 发送失败，请重试');
        } finally {
            isSending = false;
            sendBtn.disabled = false;
            sendBtn.textContent = '发送通知';
        }

        // 3秒后隐藏状态
        statusTimer = setTimeout(hideStatus, 3000);
    }

    // 按钮点击事件
    sendBtn.addEventListener('click', sendNotice);

    // 支持 Ctrl+Enter 快捷发送
    textarea.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            sendNotice();
        }
    });
</script>

</body>
</html>
